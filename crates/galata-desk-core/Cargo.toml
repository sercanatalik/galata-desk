[package]
name = "galata-desk-core"
description = "Venue data, portfolio maths and the wallet connection bridge for galata-desk. Links no UI."
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1"] }
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
hex = "0.4.3"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rmp-serde = "1.3.1"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
rust_decimal = "1.43.0"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha3 = "0.10"
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "1.2.1"
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
tokio-tungstenite = "0.30"
