# The site: the landing page at /, the book at /docs/ (site/README.md).
#
# site/build.sh does the work, the same here as locally. Every push to main
# and every pull request builds it and uploads the result, so a broken build
# or a book screenshot that differs from assets/screenshots/ is caught. Pages
# is not enabled on the repository, so nothing deploys on its own: the
# deploy job runs only when this workflow is run by hand, once Pages is on
# with source "GitHub Actions".
#
# No path filter: the site depends on site/, docs/ and assets/, and the build
# takes under a minute.

name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one half-way: a cancelled
# deploy can leave the site on a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Build
        run: ./site/build.sh

      # Uploaded on a pull request too, so the built site can be downloaded
      # and looked at before it is published.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build

  deploy:
    name: Deploy to Pages
    # By hand only: Pages is off, and a deploy to it fails. A fork's pull
    # request must never publish either way.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
